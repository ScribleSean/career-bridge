<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Career Bridge</title>
<meta name="description" content="Look up your job: see how much of it overlaps with AI, what Massachusetts employers ask for, and where you could go next.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Career Bridge</h1>
    </div>
    <div class="headrow">
      <nav class="tabs" id="nav" aria-label="Main"></nav>
      <div class="geobox"><div class="segs" id="geo" role="group" aria-label="Show numbers for"></div></div>
    </div>
  </header>
  <section class="find" aria-label="Find your job">
    <label for="q" class="sr">Find your job</label>
    <div class="combo">
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Find your job" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="results">
      <ul id="results" role="listbox" aria-label="Matching jobs" hidden></ul>
    </div>
    <div class="chips" id="examples" aria-label="Example jobs"></div>
  </section>
  <main id="main" tabindex="-1"><p class="notice" id="notice" hidden></p><div id="view"></div></main>
  <footer class="foot">
    <p><span id="lcnote"></span>BLS OEWS · O*NET 31.0 · Anthropic Economic Index</p>
  </footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
